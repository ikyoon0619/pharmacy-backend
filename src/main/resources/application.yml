spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:demo}   # 기본은 demo(H2). 로컬 MariaDB 는 local
  jpa:
    open-in-view: false

kakao:
  base-url: https://dapi.kakao.com
  rest-api-key: ${KAKAO_REST_API_KEY}        # 키는 환경변수로만 넣는다 (코드/깃에 넣지 않기)

server:
  port: ${PORT:8080}                         # Render 가 PORT 환경변수를 넣어 준다

---
# demo: 메모리 DB(H2). 설치할 것 없이 바로 실행, 배포용
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:h2:mem:pharmacy;MODE=MariaDB
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create

---
# local: docker-compose 로 띄운 MariaDB
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mariadb://localhost:3306/pharmacy-recommendation
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true