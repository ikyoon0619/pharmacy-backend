spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:demo}   # 기본은 demo(H2). 로컬 MariaDB 는 local
  jpa:
    open-in-view: false

kakao:
  base-url: https://dapi.kakao.com
  rest-api-key: ${KAKAO_REST_API_KEY}        # 키는 환경변수로만 넣는다 (코드/깃에 넣지 않기)

# Claude (AI 자연어 검색). 키가 없으면 AI 검색만 꺼지고 앱은 정상 실행된다.
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-opus-5-5}

# 공개 데모 비용 보호: 하루 전체 / 하루 IP 당 AI 검색 횟수
ai:
  daily-limit: ${AI_DAILY_LIMIT:50}
  per-client-daily-limit: ${AI_PER_CLIENT_DAILY_LIMIT:5}

# 공공데이터포털 국립중앙의료원 전국 약국 정보 (영업시간). 키가 없으면 영업시간 기능만 꺼진다.
opendata:
  service-key: ${DATA_GO_KR_SERVICE_KEY:}
  base-url: https://apis.data.go.kr/B552657/ErmctInsttInfoInqireService
  page-size: 1000

server:
  port: ${PORT:8080}                         # Render 가 PORT 환경변수를 넣어 준다

---
# demo: 메모리 DB(H2). 설치할 것 없이 바로 실행, 배포용
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:h2:mem:pharmacy;MODE=MariaDB
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create

---
# local: docker-compose 로 띄운 MariaDB
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mariadb://localhost:3306/pharmacy-recommendation
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true