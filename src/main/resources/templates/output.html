<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('검색 결과 · 약국찾기')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>

<main class="container">
    <p class="eyebrow">주소로 찾기</p>
    <h1 class="page-title" th:text="${address}">서울 강남구 테헤란로 152</h1>

    <div th:if="${#lists.isEmpty(outputs)}" class="empty">
        <strong>약국을 찾지 못했어요</strong>
        <p>주소를 찾지 못했거나 반경 10km 안에 약국이 없어요. 다른 주소로 찾거나 AI에게 문장으로 물어보세요.</p>
    </div>

    <section th:unless="${#lists.isEmpty(outputs)}">
        <h2 class="section-title">가까운 약국 <span th:text="${#lists.size(outputs)}">3</span>곳</h2>
        <ol th:replace="~{fragments :: pharmacy-list}"></ol>
    </section>

    <a href="/" class="back">← 다시 검색</a>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
