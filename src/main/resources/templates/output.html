<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>약국 추천 결과</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container">
    <h1>추천 결과</h1>
    <p class="desc">입력한 주소: <strong th:text="${address}">주소</strong></p>

    <p th:if="${#lists.isEmpty(outputs)}" class="empty">
        주소를 찾지 못했거나 반경 10km 안에 약국이 없습니다.
    </p>

    <table th:unless="${#lists.isEmpty(outputs)}">
        <thead>
        <tr>
            <th>약국명</th>
            <th>주소</th>
            <th>거리</th>
            <th>길안내</th>
            <th>로드뷰</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="o : ${outputs}">
            <td th:text="${o.pharmacyName}">약국</td>
            <td th:text="${o.pharmacyAddress}">주소</td>
            <td th:text="${o.distance}">0 km</td>
            <td><a th:href="${o.directionUrl}" target="_blank">길안내</a></td>
            <td><a th:href="${o.roadViewUrl}" target="_blank">로드뷰</a></td>
        </tr>
        </tbody>
    </table>

    <a href="/" class="back">다시 검색</a>
</main>
</body>
</html>
