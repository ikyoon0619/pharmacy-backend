<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>약국 추천</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container">
    <h1>가까운 약국 찾기</h1>
    <p class="desc">문장으로 물어보거나, 주소를 골라서 가까운 약국과 길안내 링크를 받아 보세요.</p>

    <section class="card">
        <h2>문장으로 찾기 <span class="badge">AI</span></h2>
        <form action="/ai-search" method="post" class="search-form">
            <input type="text" name="query" required maxlength="200" class="text-input"
                   placeholder="예: 강남역 근처 약국 찾아줘">
            <button type="submit">AI 검색</button>
        </form>
        <p class="hint">Claude 가 문장에서 장소를 찾아 카카오 지도 검색을 대신 불러 줍니다.
            영업시간 정보는 없으니 방문 전에 전화로 확인해 주세요.</p>
    </section>

    <section class="card">
        <h2>주소로 찾기</h2>
        <p class="hint">반경 10km 안에서 가장 가까운 약국 3곳을 알려 드립니다.</p>
    <form action="/search" method="post" class="search-form">
        <input type="text" id="address" name="address" required readonly
               placeholder="여기를 눌러 주소를 검색하세요 (예: 서울 성북구 종암로 10길)">
        <button type="submit">검색</button>
    </form>
    </section>
</main>

<!-- 카카오(다음) 우편번호 서비스: 키 없이 쓸 수 있다 -->
<script src="https://t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
    document.getElementById("address").addEventListener("click", function () {
        new daum.Postcode({
            oncomplete: function (data) {
                document.getElementById("address").value = data.address;
            }
        }).open();
    });
</script>
</body>
</html>
