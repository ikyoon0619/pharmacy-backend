<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('약국찾기 · 가까운 약국을 말로 찾기')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>

<main class="container">
    <section class="hero">
        <h1>가까운 약국,<br>말로 찾아보세요</h1>
        <p class="lead">"강남역 근처 걸어갈 수 있는 약국"처럼 물어보면 AI가 위치를 찾아 가까운 약국과 길안내를 알려 드려요.</p>
    </section>

    <section class="panel">
        <!-- 탭: CSS 만으로 전환 (라디오 버튼 + :checked) -->
        <div class="tabs" role="tablist">
            <input type="radio" name="mode" id="tab-ai" checked>
            <label for="tab-ai" role="tab">AI에게 묻기</label>
            <input type="radio" name="mode" id="tab-addr">
            <label for="tab-addr" role="tab">주소로 찾기</label>

            <div class="tab-panel" id="panel-ai">
                <form action="/ai-search" method="post" data-loading="찾는 중…" data-status="ai-status">
                    <label for="query" class="sr-only">찾고 싶은 위치를 문장으로 입력</label>
                    <div class="search-box">
                        <input type="text" id="query" name="query" required maxlength="200" autocomplete="off"
                               placeholder="예: 강남역 근처 약국 찾아줘">
                        <button type="submit" class="btn btn-primary btn-search" data-label="찾기"><span class="label">찾기</span></button>
                    </div>
                    <div class="chips" aria-label="예시 질문">
                        <button type="button" class="chip" data-q="강남역 근처 약국 찾아줘">강남역 근처</button>
                        <button type="button" class="chip" data-q="서울시청에서 걸어갈 수 있는 약국">서울시청 걸어서</button>
                        <button type="button" class="chip" data-q="부산역 주변 약국 5곳 알려줘">부산역 5곳</button>
                        <button type="button" class="chip" data-q="홍대입구역 근처 지금 문 연 약국">홍대 지금 문 연 곳?</button>
                    </div>
                    <p class="status" id="ai-status" hidden role="status">
                        <span class="spinner" aria-hidden="true"></span>
                        AI가 장소를 찾고 약국을 검색하고 있어요. 5~10초쯤 걸려요.
                    </p>
                </form>
            </div>

            <div class="tab-panel" id="panel-addr">
                <form action="/search" method="post" data-loading="찾는 중…" data-status="addr-status">
                    <label for="address" class="sr-only">주소</label>
                    <div class="search-box">
                        <input type="text" id="address" name="address" required readonly
                               placeholder="여기를 눌러 주소를 검색하세요">
                        <button type="submit" class="btn btn-primary btn-search" data-label="찾기"><span class="label">찾기</span></button>
                    </div>
                    <p class="hint">반경 10km 안에서 가장 가까운 약국 3곳을 알려 드려요.</p>
                    <p class="status" id="addr-status" hidden role="status">
                        <span class="spinner" aria-hidden="true"></span> 약국을 찾고 있어요.
                    </p>
                </form>
            </div>
        </div>
    </section>

    <section class="how">
        <h2 class="sr-only">이렇게 동작해요</h2>
        <ol class="steps">
            <li><strong>1. 위치 찾기</strong><span>문장에서 역, 건물, 주소를 골라 좌표로 바꿔요</span></li>
            <li><strong>2. 약국 검색</strong><span>그 주변 약국을 가까운 순서로 찾아요</span></li>
            <li><strong>3. 바로 출발</strong><span>길안내, 전화, 로드뷰를 한 번에</span></li>
        </ol>
    </section>
</main>

<footer th:replace="~{fragments :: footer}"></footer>

<!-- 카카오(다음) 우편번호 서비스: 키 없이 쓸 수 있다 -->
<script src="https://t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
    document.getElementById("address").addEventListener("click", function () {
        new daum.Postcode({
            oncomplete: function (data) {
                document.getElementById("address").value = data.address;
            }
        }).open();
    });
    // 예시 칩을 누르면 입력칸에 문장을 채운다 (바로 보내지 않아서 고쳐 쓸 수 있다)
    document.querySelectorAll(".chip").forEach(function (chip) {
        chip.addEventListener("click", function () {
            var input = document.getElementById("query");
            input.value = chip.dataset.q;
            input.focus();
        });
    });
</script>
<script th:replace="~{fragments :: loading-script}"></script>
</body>
</html>
