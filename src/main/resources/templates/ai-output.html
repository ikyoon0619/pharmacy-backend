<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('AI 검색 결과 · 약국찾기')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>

<main class="container">
    <!-- 결과 화면에서도 바로 다시 물어볼 수 있게 검색칸을 위에 둔다 -->
    <form action="/ai-search" method="post" class="search-box compact" data-loading="찾는 중…" data-status="ai-status">
        <label for="query" class="sr-only">다시 묻기</label>
        <input type="text" id="query" name="query" required maxlength="200" autocomplete="off" th:value="${query}">
        <button type="submit" class="btn btn-primary btn-search" data-label="다시 찾기"><span class="label">다시 찾기</span></button>
    </form>
    <p class="status" id="ai-status" hidden role="status">
        <span class="spinner" aria-hidden="true"></span> AI가 다시 찾고 있어요.
    </p>

    <!-- th:text 는 HTML 을 이스케이프한다. AI 답변을 그대로 넣어도 스크립트가 실행되지 않는다 -->
    <section class="answer" aria-label="AI 안내">
        <span class="answer-badge">AI</span>
        <p th:text="${answer}">AI 안내 문장</p>
    </section>

    <section th:unless="${#lists.isEmpty(outputs)}">
        <h2 class="section-title">가까운 약국 <span th:text="${#lists.size(outputs)}">3</span>곳</h2>
        <ol th:replace="~{fragments :: pharmacy-list}"></ol>
    </section>

    <a href="/" class="back">← 처음으로</a>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
<script th:replace="~{fragments :: loading-script}"></script>
</body>
</html>
